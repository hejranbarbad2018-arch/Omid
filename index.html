<!DOCTYPE html>
<html lang="ps">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Personal Exchange System</title>

<style>
body{
    font-family: Arial, sans-serif;
    background:#f1f5f9;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.login-box{
    background:white;
    width:320px;
    padding:25px;
    border-radius:12px;
    box-shadow:0 0 15px #bbb;
    text-align:center;
}

h2{
    color:#0066cc;
}

input{
    width:90%;
    padding:12px;
    margin:8px;
    border:1px solid #ccc;
    border-radius:6px;
}

button{
    width:95%;
    padding:12px;
    background:#0066cc;
    color:white;
    border:none;
    border-radius:6px;
    cursor:pointer;
}

button:hover{
    background:#004999;
}

#msg{
    color:red;
}
</style>

</head>

<body>

<div class="login-box">

<h2>د صرافۍ سیستم</h2>

<input id="user" placeholder="Username">

<input id="pass" type="password" placeholder="Password">

<button onclick="login()">ننوتل</button>

<p id="msg"></p>

</div>


<script>

function login(){

let user=document.getElementById("user").value;
let pass=document.getElementById("pass").value;


if(user=="admin" && pass=="12345"){

window.location.href="dashboard.html";

}
else{

document.getElementById("msg").innerHTML="نوم یا پاسورډ غلط دی";

}

}

</script>


</body>
</html>
