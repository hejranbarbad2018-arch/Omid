<!DOCTYPE html>
<html lang="ps">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Personal Exchange System</title>

<style>
body{
    font-family: Arial;
    background:#f2f2f2;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}
.login{
    background:white;
    padding:30px;
    border-radius:10px;
    width:300px;
    box-shadow:0 0 10px #aaa;
}
input,button{
    width:100%;
    padding:10px;
    margin:8px 0;
}
button{
    background:#007bff;
    color:white;
    border:0;
    cursor:pointer;
}
</style>

</head>

<body>

<div class="login">
<h2>د صرافۍ سیستم</h2>

<input id="user" placeholder="Username">
<input id="pass" type="password" placeholder="Password">

<button onclick="login()">Login</button>

<p id="msg"></p>

</div>


<script>
function login(){

let user=document.getElementById("user").value;
let pass=document.getElementById("pass").value;

if(user=="admin" && pass=="12345"){
window.location="dashboard.html";
}
else{
document.getElementById("msg").innerHTML="معلومات غلط دي";
}

}
</script>

</body>
</html>
